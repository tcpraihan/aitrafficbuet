name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: List photos for the gallery
        run: |
          cd assets/img/photos
          python3 -c "import os,json; f=sorted(x for x in os.listdir('.') if x.lower().endswith(('.jpg','.jpeg','.png','.webp','.gif','.avif'))); json.dump(f,open('photos.json','w'),indent=1); print(len(f),'photos')"
      - name: List videos
        run: |
          cd assets/videos
          python3 -c "import os,json; f=sorted(x for x in os.listdir('.') if x.lower().endswith(('.mp4','.webm','.mov','.m4v','.ogv'))); json.dump(f,open('videos.json','w'),indent=1); print(len(f),'videos')"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
